name: Django + React Full Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Fullstack App with Cython
    runs-on: windows-latest

    steps:
      # ---------------------- CHECKOUT ----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------- PYTHON SETUP ----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            backend\.venv
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: backend
        shell: cmd
        run: |
          python -m venv .venv
          call .venv\Scripts\activate.bat
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Cython setuptools wheel

      # ---------------------- NODE SETUP ----------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      # ---------------------- FRONTEND BUILD ----------------------
      - name: Build React frontend
        working-directory: frontend
        run: npm run build:production

      - name: Copy frontend build to backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/templates
          New-Item -ItemType Directory -Force -Path backend/static/assets
          
          if (Test-Path frontend/dist/index.html) {
            Copy-Item -Path frontend/dist/index.html -Destination backend/templates/ -Force
            Write-Host "✓ Copied index.html"
          }
          
          if (Test-Path frontend/dist/assets) {
            Copy-Item -Path frontend/dist/assets/* -Destination backend/static/assets/ -Recurse -Force
            Write-Host "✓ Copied assets"
          }
          
          # Copy any other frontend files (favicon, manifest, etc.)
          Get-ChildItem -Path frontend/dist -File | Where-Object { $_.Name -ne "index.html" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination backend/static/ -Force
            Write-Host "✓ Copied $($_.Name)"
          }

      # ---------------------- DJANGO STATIC COLLECTION ----------------------
      - name: Collect Django static files
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python manage.py collectstatic --noinput --clear

      # ---------------------- CREATE CYTHON BUILD SCRIPTS ----------------------
      - name: Create Cython setup.py
        working-directory: backend
        shell: pwsh
        run: |
          @'
from setuptools import setup, Extension
from Cython.Build import cythonize
import os
import glob

# Collect all Python files to compile
python_files = []
exclude_patterns = ['**/migrations/**', '**/__pycache__/**', '**/tests/**', 
                   'setup.py', 'manage.py', 'build_protected.py', '**/.venv/**',
                   '**/venv/**', '**/dist_protected/**']

for root, dirs, files in os.walk('.'):
    # Skip excluded directories
    dirs[:] = [d for d in dirs if not any(d in pattern for pattern in ['migrations', '__pycache__', 'tests', '.venv', 'venv', 'dist_protected', 'build'])]
    
    for file in files:
        if file.endswith('.py') and file not in ['setup.py', 'manage.py', 'build_protected.py']:
            filepath = os.path.join(root, file)
            python_files.append(filepath)

print(f"Found {len(python_files)} Python files to compile")
for f in python_files[:10]:  # Show first 10
    print(f"  - {f}")
if len(python_files) > 10:
    print(f"  ... and {len(python_files) - 10} more")

# Create Extension objects
extensions = [
    Extension(
        name="*",
        sources=python_files,
        extra_compile_args=["/O2"] if os.name == 'nt' else ["-O3"],
    )
]

setup(
    name="django_protected",
    ext_modules=cythonize(
        extensions,
        compiler_directives={
            'language_level': "3",
            'embedsignature': True,
        },
        build_dir="build"
    ),
)
'@ | Out-File -FilePath setup.py -Encoding UTF8
          
          Write-Host "✓ Created setup.py"

      - name: Create build_protected.py script
        working-directory: backend
        shell: pwsh
        run: |
          @'
import os
import shutil
import sys
from pathlib import Path

print("=" * 60)
print("Creating Protected Distribution")
print("=" * 60)

# Define paths
BASE_DIR = Path('.')
DIST_DIR = Path('dist_protected')
BUILD_DIR = Path('build')

# Create dist directory
if DIST_DIR.exists():
    print(f"\nRemoving existing {DIST_DIR}")
    shutil.rmtree(DIST_DIR)

DIST_DIR.mkdir(parents=True, exist_ok=True)
print(f"\n✓ Created {DIST_DIR}")

# Find all .pyd files (compiled extensions)
pyd_files = list(BUILD_DIR.rglob('*.pyd'))
print(f"\n✓ Found {len(pyd_files)} compiled .pyd files")

if len(pyd_files) == 0:
    print("\nWARNING: No .pyd files found!")
    print("Checking build directory structure:")
    if BUILD_DIR.exists():
        for item in BUILD_DIR.rglob('*'):
            if item.is_file():
                print(f"  - {item}")
    else:
        print("  Build directory doesn't exist!")

# Copy .pyd files maintaining structure
for pyd_file in pyd_files:
    # Get relative path from build dir
    try:
        rel_path = pyd_file.relative_to(BUILD_DIR)
        
        # Remove any lib.win-amd64-X.XX prefix if present
        parts = list(rel_path.parts)
        if parts and parts[0].startswith('lib.'):
            parts = parts[1:]
        
        dest_file = DIST_DIR / Path(*parts)
        dest_file.parent.mkdir(parents=True, exist_ok=True)
        
        shutil.copy2(pyd_file, dest_file)
        print(f"  Copied: {dest_file.name}")
    except Exception as e:
        print(f"  Error copying {pyd_file}: {e}")

# Copy non-Python files that are needed
print("\n✓ Copying essential files...")

files_to_copy = ['manage.py']
for file in files_to_copy:
    if Path(file).exists():
        shutil.copy2(file, DIST_DIR / file)
        print(f"  - {file}")

# Copy directories
dirs_to_copy = ['static', 'staticfiles', 'templates', 'media']
for dir_name in dirs_to_copy:
    src_dir = Path(dir_name)
    if src_dir.exists():
        dest_dir = DIST_DIR / dir_name
        if dest_dir.exists():
            shutil.rmtree(dest_dir)
        shutil.copytree(src_dir, dest_dir)
        file_count = len(list(dest_dir.rglob('*')))
        print(f"  - {dir_name}/ ({file_count} items)")

# Copy migrations (keep as .py for Django)
print("\n✓ Copying migrations...")
migration_count = 0
for migrations_dir in BASE_DIR.rglob('migrations'):
    if '.venv' not in str(migrations_dir) and 'venv' not in str(migrations_dir):
        rel_path = migrations_dir.relative_to(BASE_DIR)
        dest_migrations = DIST_DIR / rel_path
        
        if dest_migrations.exists():
            shutil.rmtree(dest_migrations)
        
        shutil.copytree(migrations_dir, dest_migrations)
        migration_count += 1
        print(f"  - {rel_path}")

if migration_count == 0:
    print("  (No migrations found)")

# Copy __init__.py files
print("\n✓ Copying __init__.py files...")
init_count = 0
for init_file in BASE_DIR.rglob('__init__.py'):
    if '.venv' not in str(init_file) and 'venv' not in str(init_file) and 'build' not in str(init_file):
        rel_path = init_file.relative_to(BASE_DIR)
        dest_init = DIST_DIR / rel_path
        dest_init.parent.mkdir(parents=True, exist_ok=True)
        shutil.copy2(init_file, dest_init)
        init_count += 1

print(f"  Copied {init_count} __init__.py files")

# Copy configuration files
print("\n✓ Copying configuration files...")
config_patterns = ['*.json', '*.yaml', '*.yml', '*.ini', '*.conf', '*.cfg', '*.toml']
for pattern in config_patterns:
    for config_file in BASE_DIR.glob(pattern):
        if config_file.name not in ['setup.py', 'build_protected.py']:
            shutil.copy2(config_file, DIST_DIR / config_file.name)
            print(f"  - {config_file.name}")

# Create a summary
print("\n" + "=" * 60)
print("Protected Distribution Summary")
print("=" * 60)

total_files = len(list(DIST_DIR.rglob('*')))
pyd_count = len(list(DIST_DIR.rglob('*.pyd')))
py_count = len(list(DIST_DIR.rglob('*.py')))

print(f"Total files: {total_files}")
print(f"  - .pyd files (compiled): {pyd_count}")
print(f"  - .py files (uncompiled): {py_count}")

if pyd_count == 0:
    print("\n⚠️  WARNING: No .pyd files were created!")
    print("   The build may have failed. Check the compilation step.")
    sys.exit(1)

print(f"\n✓ Protected distribution created in: {DIST_DIR}")
print("=" * 60)
'@ | Out-File -FilePath build_protected.py -Encoding UTF8
          
          Write-Host "✓ Created build_protected.py"

      # ---------------------- BUILD BACKEND WITH CYTHON ----------------------
      - name: Compile Django backend with Cython
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          echo Starting Cython compilation...
          echo.
          python setup.py build_ext --inplace
          echo.
          echo Cython compilation completed
          echo.
          echo Checking for compiled files...
          dir /s /b *.pyd
        continue-on-error: false

      - name: Verify Cython compilation
        working-directory: backend
        shell: pwsh
        run: |
          Write-Host "Verifying Cython compilation..."
          
          $pydFiles = Get-ChildItem -Path . -Recurse -Filter "*.pyd" -File
          
          if ($pydFiles.Count -eq 0) {
            Write-Host "ERROR: No .pyd files were created by Cython!"
            Write-Host "`nChecking build directory:"
            if (Test-Path "build") {
              Get-ChildItem -Path "build" -Recurse | Select-Object -First 20 | ForEach-Object {
                Write-Host "  $($_.FullName)"
              }
            } else {
              Write-Host "  Build directory doesn't exist!"
            }
            exit 1
          }
          
          Write-Host "✓ Found $($pydFiles.Count) .pyd files"
          $pydFiles | Select-Object -First 10 | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }
          if ($pydFiles.Count -gt 10) {
            Write-Host "  ... and $($pydFiles.Count - 10) more"
          }

      - name: Create protected distribution
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          echo Creating protected distribution...
          python build_protected.py
        continue-on-error: false

      - name: Verify protected distribution
        working-directory: backend
        shell: pwsh
        run: |
          Write-Host "Verifying protected distribution..."
          
          if (-not (Test-Path "dist_protected")) {
            Write-Host "ERROR: dist_protected directory was not created!"
            exit 1
          }
          
          $totalFiles = (Get-ChildItem -Path "dist_protected" -Recurse -File).Count
          $pydFiles = (Get-ChildItem -Path "dist_protected" -Recurse -Filter "*.pyd" -File).Count
          
          Write-Host "✓ dist_protected created"
          Write-Host "  Total files: $totalFiles"
          Write-Host "  .pyd files: $pydFiles"
          
          if ($totalFiles -eq 0) {
            Write-Host "ERROR: dist_protected is empty!"
            exit 1
          }
          
          if ($pydFiles -eq 0) {
            Write-Host "ERROR: No .pyd files in dist_protected!"
            exit 1
          }
          
          # Check for essential files
          $essentialFiles = @('manage.py')
          foreach ($file in $essentialFiles) {
            if (Test-Path "dist_protected/$file") {
              Write-Host "  ✓ $file found"
            } else {
              Write-Host "  ✗ $file missing"
            }
          }

      # ---------------------- PREPARE DEPLOYMENT PACKAGE ----------------------
      - name: Prepare deployment package
        shell: pwsh
        run: |
          Write-Host "Preparing deployment package..."
          
          $distPath = "backend/dist_protected"
          $packagePath = "deployment_package"
          
          # Final verification before copying
          if (-not (Test-Path $distPath)) {
            Write-Host "ERROR: $distPath does not exist!"
            Write-Host "`nContents of backend/:"
            Get-ChildItem -Path "backend/" | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          
          $fileCount = (Get-ChildItem -Path $distPath -Recurse -File).Count
          if ($fileCount -eq 0) {
            Write-Host "ERROR: $distPath is empty!"
            exit 1
          }
          
          Write-Host "✓ Source verified: $fileCount files"
          
          # Create package directory
          if (Test-Path $packagePath) {
            Remove-Item -Path $packagePath -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $packagePath | Out-Null
          
          # Copy protected backend
          Write-Host "`nCopying files to deployment package..."
          Copy-Item -Path "$distPath/*" -Destination $packagePath -Recurse -Force
          Write-Host "✓ Files copied"
          
          # Copy requirements
          if (Test-Path "backend/requirements.txt") {
            Copy-Item -Path "backend/requirements.txt" -Destination $packagePath -Force
            Write-Host "✓ requirements.txt copied"
          }
          
          # Create deployment script
          @"
          @echo off
          echo ================================
          echo Django Application Deployment
          echo ================================
          echo.
          
          echo Creating virtual environment...
          python -m venv venv
          
          echo Activating virtual environment...
          call venv\Scripts\activate.bat
          
          echo Installing dependencies...
          pip install -r requirements.txt
          
          echo.
          echo Running migrations...
          python manage.py migrate
          
          echo.
          echo Collecting static files...
          python manage.py collectstatic --noinput
          
          echo.
          echo ================================
          echo Deployment Complete!
          echo ================================
          echo.
          echo To run the server:
          echo   call venv\Scripts\activate.bat
          echo   python manage.py runserver
          echo.
          echo For production:
          echo   waitress-serve --port=8000 ims.wsgi:application
          echo.
          pause
          "@ | Out-File -FilePath "$packagePath/deploy.bat" -Encoding ASCII
          
          # Create run script
          @"
          @echo off
          call venv\Scripts\activate.bat
          python manage.py runserver 0.0.0.0:8000
          "@ | Out-File -FilePath "$packagePath/run_server.bat" -Encoding ASCII
          
          # Create production run script
          @"
          @echo off
          call venv\Scripts\activate.bat
          waitress-serve --port=8000 --threads=4 ims.wsgi:application
          "@ | Out-File -FilePath "$packagePath/run_production.bat" -Encoding ASCII
          
          # Create README
          @"
          # Django Protected Application
          
          ## Quick Start
          
          1. Run deployment script:
             ```
             deploy.bat
             ```
          
          2. Configure your .env file with database and other settings
          
          3. Run the application:
             - Development: `run_server.bat`
             - Production: `run_production.bat`
          
          ## Requirements
          - Python 3.12
          - Windows OS
          - All dependencies in requirements.txt
          
          ## Notes
          - This is a protected build with Cython compiled extensions (.pyd files)
          - Source code is compiled and not human-readable
          - Extensions are platform-specific (Windows)
          
          ## Manual Deployment
          
          If deploy.bat doesn't work:
          
          1. Create virtual environment:
             ```
             python -m venv venv
             venv\Scripts\activate
             ```
          
          2. Install dependencies:
             ```
             pip install -r requirements.txt
             ```
          
          3. Run migrations:
             ```
             python manage.py migrate
             ```
          
          4. Create superuser (optional):
             ```
             python manage.py createsuperuser
             ```
          
          5. Run server:
             ```
             python manage.py runserver
             ```
          
          ## Production Deployment
          
          For production, install waitress:
          ```
          pip install waitress
          ```
          
          Then run:
          ```
          waitress-serve --port=8000 --threads=4 ims.wsgi:application
          ```
          
          ## Troubleshooting
          
          - Ensure Python 3.12 is installed
          - Check that all .pyd files are present
          - Verify requirements.txt is installed
          - Check .env configuration
          
          "@ | Out-File -FilePath "$packagePath/README.md" -Encoding UTF8
          
          # Create build info
          @"
          Build Information
          =================
          
          Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Platform: Windows
          Python Version: 3.12
          Build Type: Cython Protected
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          
          Protected Files:
          - All Python source files compiled to .pyd
          - Frontend integrated into backend
          - Static files collected
          
          "@ | Out-File -FilePath "$packagePath/BUILD_INFO.txt" -Encoding UTF8
          
          Write-Host "`n✓ Deployment package prepared"

      # ---------------------- PACKAGE FINAL ARTIFACT ----------------------
      - name: Create distribution archive
        shell: pwsh
        run: |
          Write-Host "Creating distribution archive..."
          Compress-Archive -Path deployment_package/* -DestinationPath fullstack_build.zip -Force
          
          # Create checksums
          $hash = (Get-FileHash -Path fullstack_build.zip -Algorithm SHA256).Hash
          "SHA256: $hash" | Out-File -FilePath checksums.txt
          
          Write-Host "✓ Archive created"
          Write-Host "File size: $((Get-Item fullstack_build.zip).Length / 1MB) MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fullstack-Protected-Build-${{ github.sha }}
          path: |
            fullstack_build.zip
            checksums.txt
          retention-days: 90

      # ---------------------- BUILD SUMMARY ----------------------
      - name: Generate build summary
        if: always()
        shell: pwsh
        run: |
          Write-Output "## 🚀 Build Summary" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "### Build Information" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Status**: Success ✅" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Commit**: ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Branch**: ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Python**: 3.12" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Node**: 22" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Platform**: Windows" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "### 📦 Artifacts" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Fullstack-Protected-Build-${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "### 🔒 Protection" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Backend compiled with Cython (.pyd files)" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Frontend integrated and minified" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Static files collected" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "### 📥 Download" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Download the artifact from the Actions tab above." >> $env:GITHUB_STEP_SUMMARY