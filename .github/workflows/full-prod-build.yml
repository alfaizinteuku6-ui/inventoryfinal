name: Django + React Full Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Fullstack App
    runs-on: windows-latest

    steps:
      # ---------------------- CHECKOUT ----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------- PYTHON SETUP ----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            backend\.venv
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: backend
        shell: cmd
        run: |
          python -m venv .venv
          call .venv\Scripts\activate.bat
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      # ---------------------- NODE SETUP ----------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      # ---------------------- FRONTEND BUILD ----------------------
      - name: Build React frontend
        working-directory: frontend
        run: npm run build:production

      - name: Copy frontend build to backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/templates
          New-Item -ItemType Directory -Force -Path backend/static/assets
          
          if (Test-Path frontend/dist/index.html) {
            Copy-Item -Path frontend/dist/index.html -Destination backend/templates/ -Force
          }
          
          if (Test-Path frontend/dist/assets) {
            Copy-Item -Path frontend/dist/assets/* -Destination backend/static/assets/ -Recurse -Force
          }

      # ---------------------- DJANGO STATIC COLLECTION ----------------------
      - name: Collect Django static files
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python manage.py collectstatic --noinput --clear

      # ---------------------- BUILD BACKEND WITH NUITKA ----------------------
      - name: Build Django backend executable
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python -m nuitka --standalone --follow-imports --nofollow-import-to=idlelib --nofollow-import-to=tkinter --nofollow-import-to=test.support --nofollow-import-to=lib2to3 --module-parameter=django-settings-module=ims.settings --include-module=ims.asgi --include-module=ims.wsgi --include-module=ims.settings --include-package=ims --include-package=django --include-package=rest_framework --include-package=rest_framework_simplejwt --include-package=corsheaders --include-package=django_filters --include-package=django_extensions --include-package=decouple --include-package=dj_database_url --include-package=whitenoise --include-package=celery --include-package=kombu --include-package=billiard --include-package=amqp --include-package=vine --include-package=drf_yasg --include-package=PIL --include-package=redis --include-package=uvicorn --include-data-dir=templates=templates --include-data-dir=static=static --output-dir=build_output run_app.py

      # ---------------------- PACKAGE FINAL ARTIFACT ----------------------
      - name: Package build output
        shell: pwsh
        run: |
          Compress-Archive -Path backend/build_output/run_app.dist -DestinationPath fullstack_build.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fullstack-Build
          path: fullstack_build.zip