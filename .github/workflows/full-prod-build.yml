name: Django + React Full Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Fullstack App with Cython
    runs-on: windows-latest

    steps:
      # ---------------------- CHECKOUT ----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------- PYTHON SETUP ----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            backend\.venv
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: backend
        shell: cmd
        run: |
          python -m venv .venv
          call .venv\Scripts\activate.bat
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Cython setuptools wheel

      # ---------------------- NODE SETUP ----------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      # ---------------------- FRONTEND BUILD ----------------------
      - name: Build React frontend
        working-directory: frontend
        run: npm run build:production

      - name: Copy frontend build to backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/templates
          New-Item -ItemType Directory -Force -Path backend/static/assets
          
          if (Test-Path frontend/dist/index.html) {
            Copy-Item -Path frontend/dist/index.html -Destination backend/templates/ -Force
            Write-Host "✓ Copied index.html"
          }
          
          if (Test-Path frontend/dist/assets) {
            Copy-Item -Path frontend/dist/assets/* -Destination backend/static/assets/ -Recurse -Force
            Write-Host "✓ Copied assets"
          }
          
          # Copy any other frontend files (favicon, manifest, etc.)
          Get-ChildItem -Path frontend/dist -File | Where-Object { $_.Name -ne "index.html" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination backend/static/ -Force
            Write-Host "✓ Copied $($_.Name)"
          }

      # ---------------------- DJANGO STATIC COLLECTION ----------------------
      - name: Collect Django static files
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python manage.py collectstatic --noinput --clear

      # ---------------------- CREATE CYTHON BUILD SCRIPTS ----------------------
      
      # ---------------------- BUILD BACKEND WITH CYTHON ----------------------
      - name: Compile Django backend with Cython
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python setup.py build_ext --inplace
          dir /s /b *.pyd

      - name: Create protected distribution
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python build_protected.py

      - name: Create protected distribution
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          echo Creating protected distribution...
          python build_protected.py
        continue-on-error: false

      - name: Verify protected distribution
        working-directory: backend
        shell: pwsh
        run: |
          Write-Host "Verifying protected distribution..."
          
          if (-not (Test-Path "dist_protected")) {
            Write-Host "ERROR: dist_protected directory was not created!"
            exit 1
          }
          
          $totalFiles = (Get-ChildItem -Path "dist_protected" -Recurse -File).Count
          $pydFiles = (Get-ChildItem -Path "dist_protected" -Recurse -Filter "*.pyd" -File).Count
          
          Write-Host "✓ dist_protected created"
          Write-Host "  Total files: $totalFiles"
          Write-Host "  .pyd files: $pydFiles"
          
          if ($totalFiles -eq 0) {
            Write-Host "ERROR: dist_protected is empty!"
            exit 1
          }
          
          if ($pydFiles -eq 0) {
            Write-Host "ERROR: No .pyd files in dist_protected!"
            exit 1
          }
          
          # Check for essential files
          $essentialFiles = @('manage.py')
          foreach ($file in $essentialFiles) {
            if (Test-Path "dist_protected/$file") {
              Write-Host "  ✓ $file found"
            } else {
              Write-Host "  ✗ $file missing"
            }
          }

      # ---------------------- PREPARE DEPLOYMENT PACKAGE ----------------------
      - name: Prepare deployment package
        shell: pwsh
        run: |
          Write-Host "Preparing deployment package..."
          
          $distPath = "backend/dist_protected"
          $packagePath = "deployment_package"
          
          # Final verification before copying
          if (-not (Test-Path $distPath)) {
            Write-Host "ERROR: $distPath does not exist!"
            Write-Host "`nContents of backend/:"
            Get-ChildItem -Path "backend/" | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          
          $fileCount = (Get-ChildItem -Path $distPath -Recurse -File).Count
          if ($fileCount -eq 0) {
            Write-Host "ERROR: $distPath is empty!"
            exit 1
          }
          
          Write-Host "✓ Source verified: $fileCount files"
          
          # Create package directory
          if (Test-Path $packagePath) {
            Remove-Item -Path $packagePath -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $packagePath | Out-Null
          
          # Copy protected backend
          Write-Host "`nCopying files to deployment package..."
          Copy-Item -Path "$distPath/*" -Destination $packagePath -Recurse -Force
          Write-Host "✓ Files copied"
          
          # Copy requirements
          if (Test-Path "backend/requirements.txt") {
            Copy-Item -Path "backend/requirements.txt" -Destination $packagePath -Force
            Write-Host "✓ requirements.txt copied"
          }
          
          # Create deployment script
          @"
          @echo off
          echo ================================
          echo Django Application Deployment
          echo ================================
          echo.
          
          echo Creating virtual environment...
          python -m venv venv
          
          echo Activating virtual environment...
          call venv\Scripts\activate.bat
          
          echo Installing dependencies...
          pip install -r requirements.txt
          
          echo.
          echo Running migrations...
          python manage.py migrate
          
          echo.
          echo Collecting static files...
          python manage.py collectstatic --noinput
          
          echo.
          echo ================================
          echo Deployment Complete!
          echo ================================
          echo.
          echo To run the server:
          echo   call venv\Scripts\activate.bat
          echo   python manage.py runserver
          echo.
          echo For production:
          echo   waitress-serve --port=8000 ims.wsgi:application
          echo.
          pause
          "@ | Out-File -FilePath "$packagePath/deploy.bat" -Encoding ASCII
          
          # Create run script
          @"
          @echo off
          call venv\Scripts\activate.bat
          python manage.py runserver 0.0.0.0:8000
          "@ | Out-File -FilePath "$packagePath/run_server.bat" -Encoding ASCII
          
          # Create production run script
          @"
          @echo off
          call venv\Scripts\activate.bat
          waitress-serve --port=8000 --threads=4 ims.wsgi:application
          "@ | Out-File -FilePath "$packagePath/run_production.bat" -Encoding ASCII
          
          # Create README
          @"
          # Django Protected Application
          
          ## Quick Start
          
          1. Run deployment script:
             ```
             deploy.bat
             ```
          
          2. Configure your .env file with database and other settings
          
          3. Run the application:
             - Development: `run_server.bat`
             - Production: `run_production.bat`
          
          ## Requirements
          - Python 3.12
          - Windows OS
          - All dependencies in requirements.txt
          
          ## Notes
          - This is a protected build with Cython compiled extensions (.pyd files)
          - Source code is compiled and not human-readable
          - Extensions are platform-specific (Windows)
          
          ## Manual Deployment
          
          If deploy.bat doesn't work:
          
          1. Create virtual environment:
             ```
             python -m venv venv
             venv\Scripts\activate
             ```
          
          2. Install dependencies:
             ```
             pip install -r requirements.txt
             ```
          
          3. Run migrations:
             ```
             python manage.py migrate
             ```
          
          4. Create superuser (optional):
             ```
             python manage.py createsuperuser
             ```
          
          5. Run server:
             ```
             python manage.py runserver
             ```
          
          ## Production Deployment
          
          For production, install waitress:
          ```
          pip install waitress
          ```
          
          Then run:
          ```
          waitress-serve --port=8000 --threads=4 ims.wsgi:application
          ```
          
          ## Troubleshooting
          
          - Ensure Python 3.12 is installed
          - Check that all .pyd files are present
          - Verify requirements.txt is installed
          - Check .env configuration
          
          "@ | Out-File -FilePath "$packagePath/README.md" -Encoding UTF8
          
          # Create build info
          @"
          Build Information
          =================
          
          Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Platform: Windows
          Python Version: 3.12
          Build Type: Cython Protected
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          
          Protected Files:
          - All Python source files compiled to .pyd
          - Frontend integrated into backend
          - Static files collected
          
          "@ | Out-File -FilePath "$packagePath/BUILD_INFO.txt" -Encoding UTF8
          
          Write-Host "`n✓ Deployment package prepared"

      # ---------------------- PACKAGE FINAL ARTIFACT ----------------------
      - name: Create distribution archive
        shell: pwsh
        run: |
          Write-Host "Creating distribution archive..."
          Compress-Archive -Path deployment_package/* -DestinationPath fullstack_build.zip -Force
          
          # Create checksums
          $hash = (Get-FileHash -Path fullstack_build.zip -Algorithm SHA256).Hash
          "SHA256: $hash" | Out-File -FilePath checksums.txt
          
          Write-Host "✓ Archive created"
          Write-Host "File size: $((Get-Item fullstack_build.zip).Length / 1MB) MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fullstack-Protected-Build-${{ github.sha }}
          path: |
            fullstack_build.zip
            checksums.txt
          retention-days: 90

      # ---------------------- BUILD SUMMARY ----------------------
      - name: Generate build summary
        if: always()
        shell: pwsh
        run: |
          Write-Output "## 🚀 Build Summary" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "### Build Information" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Status**: Success ✅" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Commit**: ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Branch**: ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Python**: 3.12" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Node**: 22" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- **Platform**: Windows" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "### 📦 Artifacts" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Fullstack-Protected-Build-${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "### 🔒 Protection" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Backend compiled with Cython (.pyd files)" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Frontend integrated and minified" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "- Static files collected" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "### 📥 Download" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Download the artifact from the Actions tab above." >> $env:GITHUB_STEP_SUMMARY