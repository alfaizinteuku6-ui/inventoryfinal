name: Django + React Full Production Build with PyArmor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Fullstack App with PyArmor
    runs-on: windows-latest

    steps:
      # ---------------------- CHECKOUT ----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------- PYTHON SETUP ----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            backend\.venv
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: backend
        shell: cmd
        run: |
          python -m venv .venv
          call .venv\Scripts\activate.bat
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarmor

      # ---------------------- NODE SETUP ----------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      # ---------------------- FRONTEND BUILD ----------------------
      - name: Build React frontend
        working-directory: frontend
        run: npm run build:production

      - name: Copy frontend build to backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/templates
          New-Item -ItemType Directory -Force -Path backend/static/assets
          
          if (Test-Path frontend/dist/index.html) {
            Copy-Item -Path frontend/dist/index.html -Destination backend/templates/ -Force
            Write-Host "✓ Copied index.html"
          }
          
          if (Test-Path frontend/dist/assets) {
            Copy-Item -Path frontend/dist/assets/* -Destination backend/static/assets/ -Recurse -Force
            Write-Host "✓ Copied assets"
          }
          
          # Copy any other frontend files (favicon, manifest, etc.)
          Get-ChildItem -Path frontend/dist -File | Where-Object { $_.Name -ne "index.html" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination backend/static/ -Force
            Write-Host "✓ Copied $($_.Name)"
          }

      # ---------------------- DJANGO STATIC COLLECTION ----------------------
      - name: Collect Django static files
        working-directory: backend
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python manage.py collectstatic --noinput --clear

      # ---------------------- OBFUSCATE WITH PYARMOR ----------------------
      - name: Prepare backend for obfuscation
        working-directory: backend
        shell: pwsh
        run: |
          Write-Host "Preparing backend structure..."
          
          # Create output directory
          New-Item -ItemType Directory -Force -Path "dist_protected" | Out-Null
          
          # List Python files to be obfuscated
          Write-Host "`nPython files found:"
          Get-ChildItem -Path . -Filter "*.py" -Recurse -File | 
            Where-Object { $_.FullName -notmatch '\\(migrations|\\.venv|__pycache__|tests)\\' } |
            ForEach-Object { Write-Host "  - $($_.FullName.Replace($PWD.Path, ''))" }

      - name: Obfuscate Django backend with PyArmor
        working-directory: backend
        shell: pwsh
        run: |
          # Activate virtual environment
          & .venv\Scripts\Activate.ps1
          
          Write-Host "Starting PyArmor obfuscation..."
          Write-Host "Current directory: $(Get-Location)"
          
          # Check PyArmor version
          $pyarmorVersion = python -c "import pyarmor; print(pyarmor.__version__)" 2>&1
          Write-Host "PyArmor version: $pyarmorVersion"
          
          # Create a Python script to handle obfuscation
          @'
import os
import sys
from pathlib import Path
import shutil

try:
    # Try PyArmor 8.x first
    from pyarmor.cli.__main__ import main_entry
    
    print("Using PyArmor 8.x")
    
    # Prepare arguments for PyArmor gen command
    args = [
        'gen',
        '--output', 'dist_protected',
        '--platform', 'windows.x86_64',
        '--exclude', '*/migrations/*',
        '--exclude', '*/__pycache__/*', 
        '--exclude', '*/tests/*',
        '--exclude', '*.pyc',
        '--exclude', '.venv/*',
        '--exclude', 'venv/*',
        '--recursive',
        '.'
    ]
    
    sys.argv = ['pyarmor'] + args
    main_entry()
    
except ImportError:
    try:
        # Fall back to PyArmor 7.x
        from pyarmor import main as pyarmor_main
        
        print("Using PyArmor 7.x")
        
        # For PyArmor 7.x, use obfuscate command
        args = [
            'obfuscate',
            '--output', 'dist_protected',
            '--platform', 'windows.x86_64',
            '--exclude', 'migrations',
            '--exclude', '__pycache__',
            '--exclude', 'tests',
            '--exclude', '.venv',
            '--exclude', 'venv',
            '--recursive',
            '--no-cross-protection',
            '.'
        ]
        
        sys.argv = ['pyarmor'] + args
        pyarmor_main()
        
    except Exception as e:
        print(f"Error with PyArmor 7.x: {e}")
        
        # Last resort: manual file copy and simple obfuscation
        print("\nFalling back to basic obfuscation...")
        
        dist_dir = Path('dist_protected')
        dist_dir.mkdir(exist_ok=True)
        
        # Copy all Python files
        for py_file in Path('.').rglob('*.py'):
            if any(x in str(py_file) for x in ['migrations', '__pycache__', 'tests', '.venv', 'venv']):
                continue
            
            rel_path = py_file.relative_to('.')
            dest_file = dist_dir / rel_path
            dest_file.parent.mkdir(parents=True, exist_ok=True)
            
            shutil.copy2(py_file, dest_file)
            print(f"Copied: {rel_path}")
        
        print("\nWarning: Using unobfuscated files. Install PyArmor properly for protection.")
        sys.exit(0)

print("\n✓ PyArmor obfuscation completed successfully!")
'@ | Out-File -FilePath obfuscate_script.py -Encoding UTF8
          
          # Run the obfuscation script
          python obfuscate_script.py
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: PyArmor obfuscation failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          # Verify output directory exists and has files
          if (Test-Path "dist_protected") {
            $fileCount = (Get-ChildItem -Path "dist_protected" -Recurse -File).Count
            Write-Host "`n✓ Obfuscation completed!"
            Write-Host "Files in dist_protected: $fileCount"
            
            if ($fileCount -eq 0) {
              Write-Host "ERROR: No files were obfuscated!"
              exit 1
            }
          } else {
            Write-Host "ERROR: dist_protected directory was not created!"
            exit 1
          }

      - name: Copy non-Python files to protected distribution
        working-directory: backend
        shell: pwsh
        run: |
          Write-Host "Copying configuration and static files..."
          
          $dist = "dist_protected"
          
          # Verify dist_protected exists
          if (-not (Test-Path $dist)) {
            Write-Host "ERROR: dist_protected directory not found!"
            exit 1
          }
          
          Write-Host "`nCopying essential files..."
          
          # Copy manage.py
          if (Test-Path "manage.py") {
            Copy-Item -Path "manage.py" -Destination $dist -Force
            Write-Host "  ✓ manage.py"
          }
          
          # Copy any root-level Python files that might have been excluded
          Get-ChildItem -Path . -Filter "*.py" -File | Where-Object { 
            $_.Name -ne "manage.py" -and $_.Name -notmatch "^(setup|build_)" 
          } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $dist -Force -ErrorAction SilentlyContinue
            Write-Host "  ✓ $($_.Name)"
          }
          
          # Copy static files directory
          if (Test-Path "static") {
            if (Test-Path "$dist/static") {
              Remove-Item -Path "$dist/static" -Recurse -Force
            }
            Copy-Item -Path "static" -Destination "$dist/static" -Recurse -Force
            Write-Host "  ✓ static/ directory"
          }
          
          # Copy staticfiles if it exists (collected static)
          if (Test-Path "staticfiles") {
            if (Test-Path "$dist/staticfiles") {
              Remove-Item -Path "$dist/staticfiles" -Recurse -Force
            }
            Copy-Item -Path "staticfiles" -Destination "$dist/staticfiles" -Recurse -Force
            Write-Host "  ✓ staticfiles/ directory"
          }
          
          # Copy templates
          if (Test-Path "templates") {
            if (Test-Path "$dist/templates") {
              Remove-Item -Path "$dist/templates" -Recurse -Force
            }
            Copy-Item -Path "templates" -Destination "$dist/templates" -Recurse -Force
            Write-Host "  ✓ templates/ directory"
          }
          
          # Copy media folder if exists
          if (Test-Path "media") {
            if (Test-Path "$dist/media") {
              Remove-Item -Path "$dist/media" -Recurse -Force
            }
            Copy-Item -Path "media" -Destination "$dist/media" -Recurse -Force
            Write-Host "  ✓ media/ directory"
          }
          
          # Copy all migrations folders (they should remain readable)
          Write-Host "`nCopying migrations..."
          $migrationsFound = 0
          Get-ChildItem -Path . -Recurse -Filter "migrations" -Directory | 
            Where-Object { $_.FullName -notmatch '\\(dist_protected|\\.venv|venv)\\' } | 
            ForEach-Object {
              $sourcePath = $_.FullName
              $relativePath = $sourcePath.Replace($PWD.Path, "").TrimStart("\")
              $destPath = Join-Path $dist $relativePath
              
              # Create parent directory
              $parentDir = Split-Path $destPath -Parent
              if (-not (Test-Path $parentDir)) {
                New-Item -ItemType Directory -Force -Path $parentDir | Out-Null
              }
              
              # Copy migrations
              if (Test-Path $destPath) {
                Remove-Item -Path $destPath -Recurse -Force
              }
              Copy-Item -Path $sourcePath -Destination $destPath -Recurse -Force
              Write-Host "  ✓ $relativePath"
              $migrationsFound++
            }
          
          if ($migrationsFound -eq 0) {
            Write-Host "  (No migrations found)"
          }
          
          # Copy configuration files
          Write-Host "`nCopying configuration files..."
          $configFiles = @('*.json', '*.yaml', '*.yml', '*.ini', '*.conf', '*.cfg', '*.toml', '*.txt')
          foreach ($pattern in $configFiles) {
            Get-ChildItem -Path . -Filter $pattern -File | 
              Where-Object { $_.Name -notmatch '^(requirements|setup)' } |
              ForEach-Object {
                Copy-Item -Path $_.FullName -Destination $dist -Force -ErrorAction SilentlyContinue
                Write-Host "  ✓ $($_.Name)"
              }
          }
          
          # Copy __init__.py files to maintain package structure
          Write-Host "`nEnsuring package structure..."
          Get-ChildItem -Path $dist -Recurse -Directory | ForEach-Object {
            $initFile = Join-Path $_.FullName "__init__.py"
            if (-not (Test-Path $initFile)) {
              # Check if original location had __init__.py
              $relPath = $_.FullName.Replace("$PWD\$dist", "").TrimStart("\")
              $origInit = Join-Path $PWD $relPath "__init__.py"
              if (Test-Path $origInit) {
                Copy-Item -Path $origInit -Destination $initFile -Force
              }
            }
          }
          
          Write-Host "`n✓ All non-Python files copied successfully"
          
          # Final verification
          Write-Host "`nVerifying dist_protected contents..."
          $totalFiles = (Get-ChildItem -Path $dist -Recurse -File).Count
          $pyFiles = (Get-ChildItem -Path $dist -Recurse -Filter "*.py" -File).Count
          $pycFiles = (Get-ChildItem -Path $dist -Recurse -Filter "*.pyc" -File).Count
          
          Write-Host "Total files: $totalFiles"
          Write-Host "Python files (.py): $pyFiles"
          Write-Host "Compiled files (.pyc): $pycFiles"
          
          if ($totalFiles -eq 0) {
            Write-Host "ERROR: No files in dist_protected!"
            exit 1
          }
          
          Write-Host "`n✓ Distribution ready for packaging"

      # ---------------------- VERIFY BUILD ----------------------
      - name: Verify protected build
        working-directory: backend
        shell: pwsh
        run: |
          Write-Host "=== Build Verification ==="
          
          $dist = "dist_protected"
          
          if (-not (Test-Path $dist)) {
            Write-Host "ERROR: dist_protected directory does not exist!"
            exit 1
          }
          
          Write-Host "`nDirectory structure:"
          Get-ChildItem -Path $dist -Recurse -Directory | 
            Select-Object -First 20 | 
            ForEach-Object { 
              Write-Host "  📁 $($_.FullName.Replace($PWD.Path, '').TrimStart('\'))" 
            }
          
          Write-Host "`nKey files check:"
          $requiredFiles = @('manage.py')
          foreach ($file in $requiredFiles) {
            if (Test-Path "$dist/$file") {
              Write-Host "  ✓ $file found"
            } else {
              Write-Host "  ✗ $file MISSING"
            }
          }
          
          Write-Host "`nFile statistics:"
          $stats = @{
            'Python files' = (Get-ChildItem -Path $dist -Recurse -Filter "*.py" -File).Count
            'Static files' = if (Test-Path "$dist/static") { (Get-ChildItem -Path "$dist/static" -Recurse -File).Count } else { 0 }
            'Templates' = if (Test-Path "$dist/templates") { (Get-ChildItem -Path "$dist/templates" -Recurse -File).Count } else { 0 }
            'Total files' = (Get-ChildItem -Path $dist -Recurse -File).Count
          }
          
          foreach ($key in $stats.Keys) {
            Write-Host "  - ${key}: $($stats[$key])"
          }
          
          Write-Host "`n✓ Build verification completed"

      # ---------------------- PREPARE DEPLOYMENT PACKAGE ----------------------
      - name: Prepare deployment package
        shell: pwsh
        run: |
          Write-Host "Preparing deployment package..."
          
          $distPath = "backend/dist_protected"
          $packagePath = "deployment_package"
          
          # Verify source directory exists
          if (-not (Test-Path $distPath)) {
            Write-Host "ERROR: Source directory '$distPath' not found!"
            Write-Host "Checking what exists in backend/:"
            Get-ChildItem -Path "backend/" -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          
          # Check if dist_protected has content
          $fileCount = (Get-ChildItem -Path $distPath -Recurse -File).Count
          Write-Host "Files in dist_protected: $fileCount"
          
          if ($fileCount -eq 0) {
            Write-Host "ERROR: dist_protected directory is empty!"
            exit 1
          }
          
          # Create package directory
          Write-Host "`nCreating deployment package..."
          if (Test-Path $packagePath) {
            Remove-Item -Path $packagePath -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $packagePath | Out-Null
          
          # Copy protected backend
          Write-Host "Copying protected backend files..."
          Copy-Item -Path "$distPath/*" -Destination $packagePath -Recurse -Force
          Write-Host "  ✓ Backend files copied"
          
          # Copy requirements (add pyarmor-runtime if not already there)
          if (Test-Path "backend/requirements.txt") {
            $requirements = Get-Content "backend/requirements.txt"
            if ($requirements -notcontains "pyarmor-runtime") {
              Add-Content -Path "backend/requirements.txt" -Value "pyarmor-runtime"
            }
            Copy-Item -Path "backend/requirements.txt" -Destination $packagePath -Force
          }
          
          # Create .env template
          @"
          # Django Configuration
          SECRET_KEY=change-this-to-a-secure-secret-key
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          
          # Database Configuration (Example for PostgreSQL)
          # DB_ENGINE=django.db.backends.postgresql
          # DB_NAME=your_database
          # DB_USER=your_user
          # DB_PASSWORD=your_password
          # DB_HOST=localhost
          # DB_PORT=5432
          
          # Or SQLite (default)
          DB_ENGINE=django.db.backends.sqlite3
          DB_NAME=db.sqlite3
          
          # Other settings
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          "@ | Out-File -FilePath "$packagePath/.env.example" -Encoding UTF8
          
          # Create deployment script
          @"
          @echo off
          echo ================================
          echo Django Application Deployment
          echo ================================
          echo.
          
          REM Check if Python is installed
          python --version >nul 2>&1
          if errorlevel 1 (
              echo ERROR: Python is not installed or not in PATH
              echo Please install Python 3.12 and try again
              pause
              exit /b 1
          )
          
          echo Creating virtual environment...
          python -m venv venv
          
          echo Activating virtual environment...
          call venv\Scripts\activate.bat
          
          echo Upgrading pip...
          python -m pip install --upgrade pip
          
          echo Installing dependencies...
          pip install -r requirements.txt
          
          REM Check if .env exists
          if not exist .env (
              echo.
              echo WARNING: .env file not found!
              echo Copying .env.example to .env
              copy .env.example .env
              echo.
              echo IMPORTANT: Please edit .env file and configure your settings!
              echo Press any key to open .env file...
              pause
              notepad .env
          )
          
          echo.
          echo Running migrations...
          python manage.py migrate
          
          echo.
          echo Collecting static files...
          python manage.py collectstatic --noinput
          
          echo.
          echo ================================
          echo Deployment Complete!
          echo ================================
          echo.
          echo To run the server:
          echo   call venv\Scripts\activate.bat
          echo   python manage.py runserver
          echo.
          echo For production:
          echo   pip install waitress
          echo   waitress-serve --port=8000 ims.wsgi:application
          echo.
          pause
          "@ | Out-File -FilePath "$packagePath/deploy.bat" -Encoding ASCII
          
          # Create run script
          @"
          @echo off
          call venv\Scripts\activate.bat
          python manage.py runserver 0.0.0.0:8000
          "@ | Out-File -FilePath "$packagePath/run_server.bat" -Encoding ASCII
          
          # Create production run script
          @"
          @echo off
          call venv\Scripts\activate.bat
          
          REM Check if waitress is installed
          pip show waitress >nul 2>&1
          if errorlevel 1 (
              echo Installing waitress...
              pip install waitress
          )
          
          echo Starting production server on port 8000...
          waitress-serve --port=8000 --threads=4 ims.wsgi:application
          "@ | Out-File -FilePath "$packagePath/run_production.bat" -Encoding ASCII
          
          # Create README
          @"
          # Django Protected Application (PyArmor)
          
          ## 🚀 Quick Start
          
          ### 1. Deploy the Application
          
          Run the deployment script:
          ```batch
          deploy.bat
          ```
          
          This will:
          - Create a virtual environment
          - Install all dependencies (including pyarmor-runtime)
          - Set up .env configuration file
          - Run database migrations
          - Collect static files
          
          ### 2. Configure Environment
          
          Edit the `.env` file with your settings:
          - Database configuration
          - Secret key (generate a secure one!)
          - Allowed hosts
          - Debug settings (set to False in production)
          
          ### 3. Create Admin User (Optional)
          
          ```batch
          call venv\Scripts\activate
          python manage.py createsuperuser
          ```
          
          ### 4. Run the Application
          
          **Development mode:**
          ```batch
          run_server.bat
          ```
          Access at: http://localhost:8000
          
          **Production mode:**
          ```batch
          run_production.bat
          ```
          Uses Waitress WSGI server for better performance and security.
          
          ## 📋 Requirements
          
          - **Python 3.12** (Required)
          - **Windows OS** (This build is Windows-specific)
          - Internet connection for initial setup
          
          ## 🔒 Security Features
          
          This application is protected using PyArmor:
          - ✅ Python source code is obfuscated
          - ✅ Difficult to reverse engineer
          - ✅ Functions and variables are renamed
          - ✅ Code structure is transformed
          - ⚠️ Platform-specific (Windows only)
          
          ## 📁 Project Structure
          
          ```
          deployment_package/
          ├── manage.py              # Django management script
          ├── apps/                  # Protected application code
          ├── core/                  # Protected core modules
          ├── static/                # Static files (CSS, JS, images)
          ├── templates/             # HTML templates
          ├── migrations/            # Database migrations
          ├── requirements.txt       # Python dependencies
          ├── .env.example          # Environment template
          ├── deploy.bat            # Deployment script
          ├── run_server.bat        # Development server
          └── run_production.bat    # Production server
          ```
          
          ## 🔧 Manual Deployment Steps
          
          If `deploy.bat` doesn't work, follow these steps:
          
          ### 1. Create Virtual Environment
          ```batch
          python -m venv venv
          venv\Scripts\activate
          ```
          
          ### 2. Install Dependencies
          ```batch
          pip install -r requirements.txt
          ```
          
          ### 3. Configure .env File
          ```batch
          copy .env.example .env
          notepad .env
          ```
          
          ### 4. Run Migrations
          ```batch
          python manage.py migrate
          ```
          
          ### 5. Collect Static Files
          ```batch
          python manage.py collectstatic
          ```
          
          ### 6. Run Server
          ```batch
          python manage.py runserver
          ```
          
          ## 🚀 Production Deployment
          
          ### Using Waitress (Recommended)
          
          Install Waitress:
          ```batch
          pip install waitress
          ```
          
          Run production server:
          ```batch
          waitress-serve --host=0.0.0.0 --port=8000 --threads=4 ims.wsgi:application
          ```
          
          ### Using Gunicorn (Linux/Mac)
          
          If deploying on Linux:
          ```bash
          pip install gunicorn
          gunicorn --bind 0.0.0.0:8000 --workers 4 ims.wsgi:application
          ```
          
          ### Behind Nginx (Production Best Practice)
          
          1. Install Nginx
          2. Configure reverse proxy to Django application
          3. Set up SSL certificate
          4. Configure static file serving
          
          ## ⚙️ Configuration Guide
          
          ### Database Options
          
          **SQLite (Default - Development):**
          ```env
          DB_ENGINE=django.db.backends.sqlite3
          DB_NAME=db.sqlite3
          ```
          
          **PostgreSQL (Recommended - Production):**
          ```env
          DB_ENGINE=django.db.backends.postgresql
          DB_NAME=your_database
          DB_USER=your_user
          DB_PASSWORD=your_password
          DB_HOST=localhost
          DB_PORT=5432
          ```
          
          **MySQL:**
          ```env
          DB_ENGINE=django.db.backends.mysql
          DB_NAME=your_database
          DB_USER=your_user
          DB_PASSWORD=your_password
          DB_HOST=localhost
          DB_PORT=3306
          ```
          
          ### Security Settings
          
          **Generate a secure SECRET_KEY:**
          ```python
          # In Python console:
          from django.core.management.utils import get_random_secret_key
          print(get_random_secret_key())
          ```
          
          **Set ALLOWED_HOSTS:**
          ```env
          ALLOWED_HOSTS=yourdomain.com,www.yourdomain.com,your-server-ip
          ```
          
          **Disable DEBUG in production:**
          ```env
          DEBUG=False
          ```
          
          ## 🐛 Troubleshooting
          
          ### Python Not Found
          - Ensure Python 3.12 is installed
          - Add Python to system PATH
          - Restart terminal after installation
          
          ### Import Errors
          - Ensure virtual environment is activated
          - Run: `pip install -r requirements.txt`
          - Check that pyarmor-runtime is installed
          
          ### Database Errors
          - Check .env configuration
          - Ensure database server is running
          - Verify credentials are correct
          - Run migrations: `python manage.py migrate`
          
          ### Static Files Not Loading
          - Run: `python manage.py collectstatic`
          - Check STATIC_ROOT and STATIC_URL settings
          - For production, configure web server to serve static files
          
          ### PyArmor Runtime Errors
          - Ensure you're running on Windows x86_64
          - Verify pyarmor-runtime is installed
          - Check Python version matches (3.12)
          
          ## 📞 Support
          
          For issues related to:
          - **Application functionality**: Contact your application provider
          - **PyArmor protection**: Visit https://pyarmor.readthedocs.io
          - **Django framework**: Visit https://docs.djangoproject.com
          
          ## 📝 Notes
          
          - ⚠️ This build is **platform-specific** (Windows x86_64 only)
          - ⚠️ Source code is **obfuscated** and not human-readable
          - ⚠️ PyArmor runtime is **required** to run the application
          - ✅ The obfuscated code runs like normal Python
          - ✅ Performance impact is minimal
          - ✅ Can be deployed on multiple machines
          
          ## 🔐 License Information
          
          This application is protected using PyArmor. The protection applies to the
          Python source code only. The application's functionality and your rights to
          use it are governed by your agreement with the application provider.
          
          ---
          
          **Built with:** Django + React + PyArmor
          **Build Date:** $((Get-Date).ToString("yyyy-MM-dd HH:mm:ss"))
          
          "@ | Out-File -FilePath "$packagePath/README.md" -Encoding UTF8
          
          # Create build info
          @"
          Build Information
          =================
          
          Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Platform: Windows x86_64
          Python Version: 3.12
          Protection: PyArmor Obfuscation
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
