name: Protected Production Build (Optimized)

on:
  push:
    branches: [main, production]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      protection_mode:
        description: 'Protection Mode'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard    # No restrictions, works anywhere
          - private     # Maximum security, requires licensing
          - performance # Faster, less protection

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  BUILD_VERSION: ${{ github.run_number }}

jobs:
  # Job 1: Build Frontend (Internal - Not Uploaded)
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build:production
        env:
          NODE_ENV: production

      - name: Install JavaScript Obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate JavaScript Files
        working-directory: ./frontend/dist/assets
        run: |
          for file in *.js; do
            if [ -f "$file" ]; then
              echo "Obfuscating: $file"
              javascript-obfuscator "$file" \
                --output "$file" \
                --compact true \
                --control-flow-flattening true \
                --control-flow-flattening-threshold 0.75 \
                --dead-code-injection true \
                --dead-code-injection-threshold 0.4 \
                --debug-protection false \
                --disable-console-output true \
                --identifier-names-generator hexadecimal \
                --log false \
                --rename-globals false \
                --self-defending true \
                --string-array true \
                --string-array-encoding 'base64' \
                --string-array-threshold 0.75 \
                --unicode-escape-sequence false
            fi
          done

      - name: Create Frontend Build Info
        working-directory: ./frontend/dist
        run: |
          cat > build-info.json << EOF
          {
            "version": "${{ env.BUILD_VERSION }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "obfuscated": true
          }
          EOF

      - name: Upload Frontend Artifact (Temporary)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-temp
          path: frontend/dist/
          retention-days: 1

  # Job 2: Build Complete Backend with Frontend Integrated
  build-complete-backend:
    name: Build Complete Backend Package
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyarmor>=8.0.0"

      - name: Run Django Checks
        working-directory: ./backend
        run: |
          python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: ims.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'temporary-secret-key-for-build' }}
        continue-on-error: true

      - name: Collect Static Files
        working-directory: ./backend
        run: |
          python manage.py collectstatic --noinput --clear
        env:
          DJANGO_SETTINGS_MODULE: ims.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'temporary-secret-key-for-build' }}

      - name: Create Protection Directories
        working-directory: ./backend
        run: |
          mkdir -p protected_build
          mkdir -p protected_build/static
          mkdir -p protected_build/templates

      - name: Protect Python Files - Standard Mode
        if: github.event.inputs.protection_mode != 'private' && github.event.inputs.protection_mode != 'performance'
        working-directory: ./backend
        run: |
          # Create exclusion file
          cat > .pyarmor-exclude << 'EOF'
          migrations/
          __pycache__/
          venv/
          .venv/
          tests/
          *.pyc
          EOF
          
          echo "🔒 Using STANDARD protection mode (works on any machine)"
          
          # Standard protection - works on any machine, good security
          pyarmor gen --output protected_build -r .
          
          echo "✅ Protection complete!"

      - name: Protect Python Files - Private Mode
        if: github.event.inputs.protection_mode == 'private'
        working-directory: ./backend
        run: |
          cat > .pyarmor-exclude << 'EOF'
          migrations/
          __pycache__/
          venv/
          .venv/
          tests/
          *.pyc
          EOF
          
          echo "🔒 Using PRIVATE mode (maximum security)"
          
          # Private mode - maximum security
          pyarmor gen \
            --output protected_build \
            --recursive \
            --enable-jit \
            --private \
            --obf-code 2 \
            --obf-module 1 \
            --pack onefile \
            .
          
          echo "✅ Protection complete!"

      - name: Protect Python Files - Performance Mode
        if: github.event.inputs.protection_mode == 'performance'
        working-directory: ./backend
        run: |
          cat > .pyarmor-exclude << 'EOF'
          migrations/
          __pycache__/
          venv/
          .venv/
          tests/
          *.pyc
          EOF
          
          echo "🔒 Using PERFORMANCE mode (faster execution)"
          
          # Performance mode - faster, lighter protection
          pyarmor gen \
            --output protected_build \
            --recursive \
            --obf-code 1 \
            --obf-module 0 \
            .
          
          echo "✅ Protection complete!"

      - name: Copy Essential Backend Files
        working-directory: ./backend
        run: |
          set -e
          echo "📦 Copying essential backend files..."

          # Ensure target directory exists
          mkdir -p protected_build

          # Copy all __init__.py files (needed for Python packages)
          find . -name "__init__.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./protected_build/*" \
            -exec sh -c '
              dest="protected_build/$(dirname "{}")"
              mkdir -p "$dest"
              cp "{}" "$dest/"
            ' \;

          # Copy requirements
          [ -f requirements.txt ] && cp requirements.txt protected_build/ && echo "✅ Copied requirements.txt"

          # Copy staticfiles safely
          if [ -d "staticfiles" ]; then
            mkdir -p protected_build/staticfiles
            cp -r staticfiles/* protected_build/staticfiles/ 2>/dev/null || true
            echo "✅ Copied staticfiles"
          fi
          
          # Copy static directory safely
          if [ -d "static" ]; then
            mkdir -p protected_build/static
            cp -r static/* protected_build/static/ 2>/dev/null || true
            echo "✅ Copied static"
          fi

          # Copy templates safely
          if [ -d "templates" ]; then
            mkdir -p protected_build/templates
            cp -r templates/* protected_build/templates/ 2>/dev/null || true
            echo "✅ Copied templates"
          fi

          # Copy migrations (must be unprotected)
          find . -type d -name "migrations" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./protected_build/*" \
            -exec sh -c '
              dest="protected_build/$(dirname "{}")"
              mkdir -p "$dest"
              cp -r "{}" "$dest/"
            ' \;
          echo "✅ Copied migrations"

          # Copy config files if they exist
          for file in .env.example runtime.txt Procfile; do
            [ -f "$file" ] && cp "$file" protected_build/ && echo "✅ Copied $file"
          done

          echo "✅ Essential file copy complete."

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-temp
          path: frontend-dist

      - name: Integrate Frontend into Backend
        working-directory: ./backend/protected_build
        run: |
          echo "🔄 Integrating frontend into backend..."
          
          # Ensure directories exist
          mkdir -p templates
          mkdir -p static/assets
          mkdir -p staticfiles/assets
          
          # Copy index.html to templates
          if [ -f "../../frontend-dist/index.html" ]; then
            cp ../../frontend-dist/index.html templates/
            echo "✅ Copied index.html to templates/"
          fi
          
          # Copy frontend assets to static
          if [ -d "../../frontend-dist/assets" ]; then
            cp -r ../../frontend-dist/assets/* static/assets/
            echo "✅ Copied frontend assets to static/assets/"
          fi
          
          # Copy frontend assets to staticfiles
          if [ -d "../../frontend-dist/assets" ]; then
            cp -r ../../frontend-dist/assets/* staticfiles/assets/
            echo "✅ Copied frontend assets to staticfiles/assets/"
          fi
          
          # Copy any other files from frontend dist (favicon, etc.)
          find ../../frontend-dist -maxdepth 1 -type f ! -name "index.html" -exec cp {} static/ \;
          
          echo "✅ Frontend integration complete!"

      - name: Create Complete Build Info
        working-directory: ./backend/protected_build
        run: |
          cat > build-info.json << EOF
          {
            "version": "${{ env.BUILD_VERSION }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "protected": true,
            "protectionMode": "${{ github.event.inputs.protection_mode || 'standard' }}",
            "pythonVersion": "${{ env.PYTHON_VERSION }}",
            "nodeVersion": "${{ env.NODE_VERSION }}",
            "pyarmorVersion": "$(pip show pyarmor | grep Version | cut -d' ' -f2)",
            "includes": {
              "backend": true,
              "frontend": true,
              "static": true,
              "templates": true
            }
          }
          EOF

      - name: Verify Complete Build
        working-directory: ./backend/protected_build
        run: |
          echo "📋 Verifying complete build..."
          echo ""
          echo "=== Directory Structure ==="
          ls -la
          echo ""
          echo "=== Key Files Check ==="
          [ -f "manage.py" ] && echo "✅ manage.py found" || echo "❌ manage.py missing"
          [ -f "requirements.txt" ] && echo "✅ requirements.txt found" || echo "❌ requirements.txt missing"
          [ -f "build-info.json" ] && echo "✅ build-info.json found" || echo "❌ build-info.json missing"
          echo ""
          echo "=== Frontend Integration Check ==="
          [ -f "templates/index.html" ] && echo "✅ templates/index.html found" || echo "❌ templates/index.html missing"
          [ -d "static/assets" ] && echo "✅ static/assets/ found" || echo "❌ static/assets/ missing"
          [ -d "staticfiles/assets" ] && echo "✅ staticfiles/assets/ found" || echo "❌ staticfiles/assets/ missing"
          echo ""
          echo "=== Assets Count ==="
          echo "Static assets: $(find static/assets -type f 2>/dev/null | wc -l) files"
          echo "Staticfiles assets: $(find staticfiles/assets -type f 2>/dev/null | wc -l) files"
          echo ""
          echo "✅ Build verification complete!"

      - name: Upload Complete Backend Package
        uses: actions/upload-artifact@v4
        with:
          name: complete-backend-deployment
          path: backend/protected_build/
          retention-days: 90
          compression-level: 9

  # Job 3: Create Deployment Package with Scripts
  create-deployment-package:
    name: Create Deployment Package
    needs: [build-complete-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (for docs)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Download Complete Backend
        uses: actions/download-artifact@v4
        with:
          name: complete-backend-deployment
          path: deployment/backend

      - name: Create Deployment Script (Linux/macOS)
        run: |
          cat > deployment/DEPLOY.sh << 'EOFSH'
          #!/bin/bash
          set -e
          
          # Colors
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m'
          
          clear
          echo -e "${BLUE}=========================================${NC}"
          echo -e "${BLUE}  Complete Django + React Deployment${NC}"
          echo -e "${BLUE}=========================================${NC}"
          echo ""
          
          # Check Python
          if ! command -v python3 &> /dev/null; then
              echo -e "${RED}❌ Python 3 is not installed${NC}"
              echo "Please install Python 3.12 or higher"
              exit 1
          fi
          
          PYTHON_VERSION=$(python3 --version | cut -d' ' -f2)
          echo -e "${GREEN}✅ Python $PYTHON_VERSION detected${NC}"
          echo ""
          
          # Navigate to backend
          cd backend
          
          echo -e "${GREEN}[1/7] Creating virtual environment...${NC}"
          python3 -m venv venv
          
          echo -e "${GREEN}[2/7] Activating virtual environment...${NC}"
          source venv/bin/activate
          
          echo -e "${GREEN}[3/7] Upgrading pip...${NC}"
          pip install --upgrade pip --quiet
          
          echo -e "${GREEN}[4/7] Installing dependencies...${NC}"
          pip install -r requirements.txt --quiet
          echo "✅ Dependencies installed"
          
          echo -e "${GREEN}[5/7] Setting up environment...${NC}"
          if [ ! -f ".env" ]; then
              if [ -f ".env.example" ]; then
                  cp .env.example .env
                  echo -e "${YELLOW}⚠️  Created .env from .env.example${NC}"
                  echo -e "${YELLOW}⚠️  Please edit .env with your settings${NC}"
              else
                  echo -e "${YELLOW}⚠️  No .env file found. Please create one.${NC}"
              fi
          fi
          
          echo -e "${GREEN}[6/7] Running migrations...${NC}"
          python manage.py migrate
          
          echo -e "${GREEN}[7/7] Verifying static files...${NC}"
          echo "✅ Static files already integrated"
          
          echo ""
          echo -e "${GREEN}=========================================${NC}"
          echo -e "${GREEN}  ✅ Deployment Complete!${NC}"
          echo -e "${GREEN}=========================================${NC}"
          echo ""
          echo -e "${YELLOW}To create a superuser:${NC}"
          echo "  python manage.py createsuperuser"
          echo ""
          echo -e "${YELLOW}To start the development server:${NC}"
          echo "  python manage.py runserver 0.0.0.0:8000"
          echo ""
          echo -e "${YELLOW}For production, use Gunicorn:${NC}"
          echo "  pip install gunicorn"
          echo "  gunicorn ims.wsgi:application --bind 0.0.0.0:8000 --workers 4"
          echo ""
          echo -e "${BLUE}Access your application at: http://localhost:8000${NC}"
          echo ""
          EOFSH
          
          chmod +x deployment/DEPLOY.sh

      - name: Create Deployment Script (Windows)
        run: |
          cat > deployment/DEPLOY.bat << 'EOFBAT'
          @echo off
          setlocal enabledelayedexpansion
          title Complete Django + React Deployment
          color 0A
          
          cls
          echo =========================================
          echo   Complete Django + React Deployment
          echo =========================================
          echo.
          
          where python >nul 2>nul
          if %errorlevel% neq 0 (
              color 0C
              echo [ERROR] Python is not installed!
              echo Please install Python 3.12 or higher from python.org
              pause
              exit /b 1
          )
          
          python --version
          echo.
          
          cd backend
          
          echo [1/7] Creating virtual environment...
          python -m venv venv
          
          echo [2/7] Activating virtual environment...
          call venv\Scripts\activate.bat
          
          echo [3/7] Upgrading pip...
          pip install --upgrade pip >nul 2>&1
          
          echo [4/7] Installing dependencies...
          pip install -r requirements.txt
          
          echo [5/7] Setting up environment...
          if not exist .env (
              if exist .env.example (
                  copy .env.example .env >nul
                  echo WARNING: Created .env from .env.example
                  echo Please edit .env with your settings
              ) else (
                  echo WARNING: No .env file found. Please create one.
              )
          )

          echo [6/7] Generating PyArmor runtime for Windows...
          pyarmor gen runtime --platform windows.x86_64 --output win_runtime
          
          echo Copying runtime files...
          copy win_runtime\pyarmor_runtime_000000\pyarmor_runtime.pyd pyarmor_runtime_000000\
          
          echo Cleaning up temporary files...
          rmdir /s /q win_runtime
          
          echo [7/7] Running migrations...
          python manage.py migrate
          
          echo.
          echo =========================================
          echo   Deployment Complete!
          echo =========================================
          echo.
          echo Static files are already integrated!
          echo.
          echo To create a superuser:
          echo   python manage.py createsuperuser
          echo.
          echo To start the development server:
          echo   python manage.py runserver 0.0.0.0:8000
          echo.
          echo For production, use Waitress:
          echo   pip install waitress
          echo   waitress-serve --port=8000 ims.wsgi:application
          echo.
          echo Access your application at: http://localhost:8000
          echo.
          pause
          EOFBAT

      - name: Create README
        run: |
          cat > deployment/DEPLOYMENT_README.md << 'EOFMD'
          # 🚀 Complete Protected Production Build
          
          ## 📦 Build Information
          - **Version**: ${{ env.BUILD_VERSION }}
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Protection Mode**: ${{ github.event.inputs.protection_mode || 'standard' }}
          
          ## 📋 What's Included
          
          This is a **complete, ready-to-run** deployment package that includes:
          
          ✅ **Backend (Protected with PyArmor)**
          - Django application with obfuscated Python code
          - All migrations and database models
          - API endpoints and business logic
          
          ✅ **Frontend (Integrated & Obfuscated)**
          - React application (obfuscated JavaScript)
          - All static assets (CSS, images, fonts)
          - Already integrated into Django's static/templates
          
          ✅ **Static Files**
          - Frontend assets in `static/assets/`
          - Collected static files in `staticfiles/`
          - Templates including `index.html`
          
          ✅ **Deployment Scripts**
          - Automated setup for Linux/macOS (`DEPLOY.sh`)
          - Automated setup for Windows (`DEPLOY.bat`)
          
          ## ⚠️ Security Notice
          
          This is a PROTECTED build with obfuscated code:
          - Backend: Protected with PyArmor (${{ github.event.inputs.protection_mode || 'standard' }} mode)
          - Frontend: Obfuscated with JavaScript Obfuscator
          
          **Do not:**
          - Attempt to decompile or reverse engineer
          - Modify protected Python files
          - Share without authorization
          
          ## 🎯 Quick Start
          
          ### Linux/macOS
          ```bash
          bash DEPLOY.sh
          ```
          
          ### Windows
          ```cmd
          DEPLOY.bat
          ```
          
          ## 📋 Manual Deployment
          
          ### 1. Prerequisites
          - Python 3.12+ installed
          - pip package manager
          - Virtual environment support
          
          ### 2. Setup
          ```bash
          cd backend
          python3 -m venv venv
          source venv/bin/activate  # Windows: venv\Scripts\activate
          pip install -r requirements.txt
          ```
          
          ### 3. Environment Configuration
          ```bash
          cp .env.example .env
          # Edit .env with your settings
          ```
          
          Required environment variables:
          ```env
          SECRET_KEY=your-secret-key-here
          DEBUG=False
          ALLOWED_HOSTS=your-domain.com,localhost
          DATABASE_URL=your-database-url
          ```
          
          ### 4. Database Setup
          ```bash
          python manage.py migrate
          python manage.py createsuperuser
          ```
          
          ### 5. Start Server
          
          **Development:**
          ```bash
          python manage.py runserver 0.0.0.0:8000
          ```
          
          **Production (Linux/macOS - Gunicorn):**
          ```bash
          pip install gunicorn
          gunicorn ims.wsgi:application \
            --bind 0.0.0.0:8000 \
            --workers 4 \
            --timeout 120
          ```
          
          **Production (Windows - Waitress):**
          ```bash
          pip install waitress
          waitress-serve --port=8000 ims.wsgi:application
          ```
          
          ## 📁 Directory Structure
          
          ```
          backend/
          ├── manage.py                 # Django management script
          ├── requirements.txt          # Python dependencies
          ├── build-info.json          # Build metadata
          ├── .env.example             # Environment template
          ├── static/                  # Static files + frontend
          │   ├── assets/              # Frontend JavaScript/CSS
          │   └── ...                  # Other static files
          ├── staticfiles/             # Collected static files
          │   └── assets/              # Frontend assets
          ├── templates/               # Django templates
          │   └── index.html           # React app entry point
          ├── pyarmor_runtime_000000/  # PyArmor runtime
          └── [app_folders]/           # Protected Django apps
          ```
          
          ## 🔐 Production Checklist
          
          - [ ] Set strong SECRET_KEY (generate new one)
          - [ ] Set DEBUG=False
          - [ ] Configure ALLOWED_HOSTS
          - [ ] Setup production database (PostgreSQL recommended)
          - [ ] Configure CORS settings
          - [ ] Setup reverse proxy (Nginx/Apache)
          - [ ] Enable HTTPS with SSL certificate
          - [ ] Configure firewall rules
          - [ ] Setup monitoring and logging
          - [ ] Configure automated backups
          - [ ] Test all functionality
          
          ## 🌐 Web Server Configuration
          
          ### Nginx Example
          ```nginx
          server {
              listen 80;
              server_name your-domain.com;
              
              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              
              location /static/ {
                  alias /path/to/backend/staticfiles/;
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
              
              location /media/ {
                  alias /path/to/backend/media/;
              }
          }
          ```
          
          ## 🔄 Celery Setup (if using background tasks)
          
          ```bash
          # Install Redis
          # Ubuntu: sudo apt install redis-server
          # macOS: brew install redis
          # Windows: Download from https://github.com/tporadowski/redis/releases
          
          # Start Celery Worker
          celery -A config worker -l info --pool=solo
          
          # Start Celery Beat (for scheduled tasks)
          celery -A config beat -l info
          ```
          
          ## 🐛 Troubleshooting
          
          ### Issue: PyArmor runtime error on Windows
          **Solution**: Run this in your virtual environment:
          ```bash
          pyarmor gen runtime --platform windows.x86_64 --output win_runtime
          copy win_runtime\pyarmor_runtime_000000\pyarmor_runtime.pyd pyarmor_runtime_000000\
          ```
          
          ### Issue: Static files not loading
          **Solution**: Check if staticfiles are in the correct location:
          ```bash
          ls -la staticfiles/assets/
          ```
          
          ### Issue: Frontend not rendering
          **Solution**: Verify index.html exists:
          ```bash
          ls -la templates/index.html
          ```
          
          ## 📞 Support
          
          For issues or questions:
          - Check logs in `backend/logs/`
          - Review `build-info.json` for build details
          - Enable DEBUG temporarily for detailed errors
          - Contact: [Your Contact Info]
          
          ## 📄 License
          
          This is proprietary software. Unauthorized distribution is prohibited.
          
          ---
          Generated by GitHub Actions Build #${{ env.BUILD_VERSION }}
          EOFMD

      - name: Create Archive Files
        run: |
          # Create tar.gz for Linux/macOS
          tar -czf django-react-complete-v${{ env.BUILD_VERSION }}.tar.gz deployment/
          
          # Create zip for Windows
          cd deployment && zip -r ../django-react-complete-v${{ env.BUILD_VERSION }}.zip . && cd ..

      - name: Upload Complete Package (TAR.GZ)
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-tar
          path: django-react-complete-v${{ env.BUILD_VERSION }}.tar.gz
          retention-days: 90

      - name: Upload Complete Package (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-zip
          path: django-react-complete-v${{ env.BUILD_VERSION }}.zip
          retention-days: 90

      - name: Generate Build Report
        run: |
          cat > build-report.md << 'EOFREP'
          # 📊 Build Report
          
          ## Build Details
          - **Build Number**: #${{ env.BUILD_VERSION }}
          - **Commit SHA**: `${{ github.sha }}`
          - **Branch**: ${{ github.ref_name }}
          - **Trigger**: ${{ github.event_name }}
          - **Actor**: @${{ github.actor }}
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Protection Mode**: ${{ github.event.inputs.protection_mode || 'standard' }}
          
          ## 📦 Artifacts Generated
          
          ### Main Artifact: `complete-backend-deployment`
          This is the **ONLY** artifact you need to deploy!
          
          ✅ **Complete Backend Build** 
