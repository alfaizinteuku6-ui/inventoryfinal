          ## 🚀 Deployment Instructions
          
          ### Quick Deploy
          ```bash
          # Windows
          1. Extract: django-react-complete-v${{ env.BUILD_VERSION }}.zip
          2. Open folder in terminal
          3. Run: DEPLOY.bat
          
          # Linux/macOS
          1. Extract: tar -xzf django-react-complete-v${{ env.BUILD_VERSION }}.tar.gz
          2. cd deployment
          3. Run: bash DEPLOY.sh
          ```