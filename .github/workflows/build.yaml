name: Protected Production Build (Optimized)

on:
  push:
    branches: [main, production]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      protection_mode:
        description: 'Protection Mode'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard    # No restrictions, works anywhere
          - private     # Maximum security, requires licensing
          - performance # Faster, less protection

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  BUILD_VERSION: ${{ github.run_number }}

jobs:
  # Job 1: Build Frontend (Internal - Not Uploaded)
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build:production
        env:
          NODE_ENV: production

      - name: Create Frontend Build Info
        working-directory: ./frontend/dist
        run: |
          cat > build-info.json << EOF
          {
            "version": "${{ env.BUILD_VERSION }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "obfuscated": true
          }
          EOF

      - name: Upload Frontend Artifact (Temporary)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-temp
          path: frontend/dist/
          retention-days: 1

  # Job 2: Build Complete Backend with Frontend Integrated
  build-complete-backend:
    name: Build Complete Backend Package
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyarmor>=8.0.0"

      - name: Run Django Checks
        working-directory: ./backend
        run: |
          python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: ims.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'temporary-secret-key-for-build' }}
        continue-on-error: true

      - name: Collect Static Files
        working-directory: ./backend
        run: |
          python manage.py collectstatic --noinput --clear
        env:
          DJANGO_SETTINGS_MODULE: ims.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'temporary-secret-key-for-build' }}

      - name: Create Protection Directories
        working-directory: ./backend
        run: |
          mkdir -p protected_build
          mkdir -p protected_build/static
          mkdir -p protected_build/templates

      - name: Protect Python Files - Standard Mode
        if: github.event.inputs.protection_mode != 'private' && github.event.inputs.protection_mode != 'performance'
        working-directory: ./backend
        run: |
          # Create exclusion file
          cat > .pyarmor-exclude << 'EOF'
          migrations/
          __pycache__/
          venv/
          .venv/
          tests/
          *.pyc
          EOF
          
          echo "🔒 Using STANDARD protection mode (works on any machine)"
          
          # Standard protection - works on any machine, good security
          pyarmor gen --output protected_build -r .
          
          echo "✅ Protection complete!"

      - name: Protect Python Files - Private Mode
        if: github.event.inputs.protection_mode == 'private'
        working-directory: ./backend
        run: |
          cat > .pyarmor-exclude << 'EOF'
          migrations/
          __pycache__/
          venv/
          .venv/
          tests/
          *.pyc
          EOF
          
          echo "🔒 Using PRIVATE mode (maximum security)"
          
          # Private mode - maximum security
          pyarmor gen \
            --output protected_build \
            --recursive \
            --enable-jit \
            --private \
            --obf-code 2 \
            --obf-module 1 \
            --pack onefile \
            .
          
          echo "✅ Protection complete!"

      - name: Protect Python Files - Performance Mode
        if: github.event.inputs.protection_mode == 'performance'
        working-directory: ./backend
        run: |
          cat > .pyarmor-exclude << 'EOF'
          migrations/
          __pycache__/
          venv/
          .venv/
          tests/
          *.pyc
          EOF
          
          echo "🔒 Using PERFORMANCE mode (faster execution)"
          
          # Performance mode - faster, lighter protection
          pyarmor gen \
            --output protected_build \
            --recursive \
            --obf-code 1 \
            --obf-module 0 \
            .
          
          echo "✅ Protection complete!"

      - name: Copy Essential Backend Files
        working-directory: ./backend
        run: |
          set -e
          echo "📦 Copying essential backend files..."

          # Ensure target directory exists
          mkdir -p protected_build

          # Copy all __init__.py files (needed for Python packages)
          find . -name "__init__.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./protected_build/*" \
            -exec sh -c '
              dest="protected_build/$(dirname "{}")"
              mkdir -p "$dest"
              cp "{}" "$dest/"
            ' \;

          # Copy requirements
          [ -f requirements.txt ] && cp requirements.txt protected_build/ && echo "✅ Copied requirements.txt"

          # Copy staticfiles safely
          if [ -d "staticfiles" ]; then
            mkdir -p protected_build/staticfiles
            cp -r staticfiles/* protected_build/staticfiles/ 2>/dev/null || true
            echo "✅ Copied staticfiles"
          fi
          
          # Copy static directory safely
          if [ -d "static" ]; then
            mkdir -p protected_build/static
            cp -r static/* protected_build/static/ 2>/dev/null || true
            echo "✅ Copied static"
          fi

          # Copy templates safely
          if [ -d "templates" ]; then
            mkdir -p protected_build/templates
            cp -r templates/* protected_build/templates/ 2>/dev/null || true
            echo "✅ Copied templates"
          fi

          # Copy migrations (must be unprotected)
          find . -type d -name "migrations" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./protected_build/*" \
            -exec sh -c '
              dest="protected_build/$(dirname "{}")"
              mkdir -p "$dest"
              cp -r "{}" "$dest/"
            ' \;
          echo "✅ Copied migrations"

          # Copy config files if they exist
          for file in .env.example runtime.txt Procfile; do
            [ -f "$file" ] && cp "$file" protected_build/ && echo "✅ Copied $file"
          done

          echo "✅ Essential file copy complete."

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-temp
          path: frontend-dist

      - name: Integrate Frontend into Backend
        working-directory: ./backend/protected_build
        run: |
          echo "🔄 Integrating frontend into backend..."
          
          # Ensure directories exist
          mkdir -p templates
          mkdir -p static/assets
          mkdir -p staticfiles/assets
          
          # Copy index.html to templates
          if [ -f "../../frontend-dist/index.html" ]; then
            cp ../../frontend-dist/index.html templates/
            echo "✅ Copied index.html to templates/"
          fi
          
          # Copy frontend assets to static
          if [ -d "../../frontend-dist/assets" ]; then
            cp -r ../../frontend-dist/assets/* static/assets/
            echo "✅ Copied frontend assets to static/assets/"
          fi
          
          # Copy frontend assets to staticfiles
          if [ -d "../../frontend-dist/assets" ]; then
            cp -r ../../frontend-dist/assets/* staticfiles/assets/
            echo "✅ Copied frontend assets to staticfiles/assets/"
          fi
          
          # Copy any other files from frontend dist (favicon, etc.)
          find ../../frontend-dist -maxdepth 1 -type f ! -name "index.html" -exec cp {} static/ \;
          
          echo "✅ Frontend integration complete!"

      - name: Copy Deployment Scripts
        working-directory: ./backend/protected_build
        run: |
          echo "📦 Copying deployment scripts..."
          
          # Copy DEPLOY.sh if it exists
          if [ -f "../DEPLOY.sh" ]; then
            cp ../DEPLOY.sh ./
            chmod +x DEPLOY.sh
            echo "✅ Copied DEPLOY.sh"
          else
            echo "⚠️  DEPLOY.sh not found at backend/DEPLOY.sh"
          fi
          
          # Copy DEPLOY.bat if it exists
          if [ -f "../DEPLOY.bat" ]; then
            cp ../DEPLOY.bat ./
            echo "✅ Copied DEPLOY.bat"
          else
            echo "⚠️  DEPLOY.bat not found at backend/DEPLOY.bat"
          fi
          
          # Copy setup_autostart.bat from scripts folder
          if [ -f "../setup_autostart.bat" ]; then
            cp ../setup_autostart.bat ./
            echo "✅ Copied setup_autostart.bat"
          else
            echo "⚠️  setup_autostart.bat not found at setup_autostart.bat"
          fi
          
          echo "✅ Deployment scripts copied!"

      - name: Create Complete Build Info
        working-directory: ./backend/protected_build
        run: |
          cat > build-info.json << EOF
          {
            "version": "${{ env.BUILD_VERSION }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "protected": true,
            "protectionMode": "${{ github.event.inputs.protection_mode || 'standard' }}",
            "pythonVersion": "${{ env.PYTHON_VERSION }}",
            "nodeVersion": "${{ env.NODE_VERSION }}",
            "pyarmorVersion": "$(pip show pyarmor | grep Version | cut -d' ' -f2)",
            "includes": {
              "backend": true,
              "frontend": true,
              "static": true,
              "templates": true
            }
          }
          EOF

      - name: Verify Complete Build
        working-directory: ./backend/protected_build
        run: |
          echo "📋 Verifying complete build..."
          echo ""
          echo "=== Directory Structure ==="
          ls -la
          echo ""
          echo "=== Key Files Check ==="
          [ -f "manage.py" ] && echo "✅ manage.py found" || echo "❌ manage.py missing"
          [ -f "requirements.txt" ] && echo "✅ requirements.txt found" || echo "❌ requirements.txt missing"
          [ -f "build-info.json" ] && echo "✅ build-info.json found" || echo "❌ build-info.json missing"
          echo ""
          echo "=== Frontend Integration Check ==="
          [ -f "templates/index.html" ] && echo "✅ templates/index.html found" || echo "❌ templates/index.html missing"
          [ -d "static/assets" ] && echo "✅ static/assets/ found" || echo "❌ static/assets/ missing"
          [ -d "staticfiles/assets" ] && echo "✅ staticfiles/assets/ found" || echo "❌ staticfiles/assets/ missing"
          echo ""
          echo "=== Assets Count ==="
          echo "Static assets: $(find static/assets -type f 2>/dev/null | wc -l) files"
          echo "Staticfiles assets: $(find staticfiles/assets -type f 2>/dev/null | wc -l) files"
          echo ""
          echo "✅ Build verification complete!"

      - name: Upload Complete Backend Package
        uses: actions/upload-artifact@v4
        with:
          name: complete-backend-deployment
          path: backend/protected_build/
          retention-days: 90
          compression-level: 9

  # Job 3: Create Deployment Package
  create-deployment-package:
    name: Create Deployment Package
    needs: [build-complete-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Download Complete Backend
        uses: actions/download-artifact@v4
        with:
          name: complete-backend-deployment
          path: deployment

      - name: Create README
        run: |
          cat > deployment/DEPLOYMENT_README.md << 'EOFMD'
          # 🚀 Complete Protected Production Build
          
          ## 📦 Build Information
          - **Version**: ${{ env.BUILD_VERSION }}
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Protection Mode**: ${{ github.event.inputs.protection_mode || 'standard' }}
          
          ## 📋 Package Contents
          
          ```
          deployment/
          ├── DEPLOY.sh                    # Linux/macOS deployment script
          ├── DEPLOY.bat                   # Windows deployment script
          ├── setup_autostart.bat          # Windows auto-start setup (NSSM)
          ├── DEPLOYMENT_README.md         # This file
          ├── manage.py                    # Django management
          ├── requirements.txt             # Dependencies
          ├── build-info.json              # Build metadata
          ├── static/                      # Frontend assets integrated
          │   └── assets/                  # JS, CSS, images
          ├── staticfiles/                 # Collected static files
          │   └── assets/                  # Frontend assets
          ├── templates/                   # Django templates
          │   └── index.html               # React entry point
          ├── pyarmor_runtime_000000/      # PyArmor runtime
          └── [protected_apps]/            # Protected Django code
          ```
          
          ## ⚠️ Security Notice
          
          This is a PROTECTED build:
          - Backend: PyArmor (${{ github.event.inputs.protection_mode || 'standard' }} mode)
          - Frontend: JavaScript Obfuscator
          
          **Do not attempt to decompile or reverse engineer.**
          
          ## 🎯 Quick Start
          
          ### Linux/macOS
          ```bash
          bash DEPLOY.sh
          ```
          
          ### Windows
          ```cmd
          DEPLOY.bat
          ```
          
          ### Windows Auto-Start (Optional)
          ```cmd
          setup_autostart.bat
          ```
          This will set up Django + Celery as Windows services using NSSM.
          
          ## 📋 Manual Setup
          
          ### 1. Create Virtual Environment
          ```bash
          # Linux/macOS
          python3 -m venv venv
          source venv/bin/activate
          
          # Windows
          python -m venv venv
          venv\Scripts\activate
          ```
          
          ### 2. Install Dependencies
          ```bash
          pip install --upgrade pip
          pip install -r requirements.txt
          ```
          
          ### 3. Windows: Generate PyArmor Runtime
          ```bash
          pyarmor gen runtime --platform windows.x86_64 --output win_runtime
          copy win_runtime\pyarmor_runtime_000000\pyarmor_runtime.pyd pyarmor_runtime_000000\
          rmdir /s /q win_runtime
          ```
          
          ### 4. Environment Configuration
          ```bash
          # Copy example and edit
          cp .env.example .env
          ```
          
          Required variables:
          ```env
          SECRET_KEY=your-secret-key
          DEBUG=False
          ALLOWED_HOSTS=your-domain.com,localhost
          DATABASE_URL=your-database-url
          ```
          
          ### 5. Database Setup
          ```bash
          python manage.py migrate
          python manage.py createsuperuser
          ```
          
          ### 6. Start Server
          ```bash
          # Development
          python manage.py runserver 0.0.0.0:8000
          
          # Production (Linux/macOS)
          gunicorn ims.wsgi:application --bind 0.0.0.0:8000 --workers 4
          
          # Production (Windows)
          waitress-serve --port=8000 ims.wsgi:application
          ```
          
          ## 🔐 Production Checklist
          
          - [ ] Generate new SECRET_KEY
          - [ ] Set DEBUG=False
          - [ ] Configure ALLOWED_HOSTS
          - [ ] Use PostgreSQL/MySQL (not SQLite)
          - [ ] Configure CORS properly
          - [ ] Setup Nginx/Apache reverse proxy
          - [ ] Enable HTTPS/SSL
          - [ ] Configure firewall
          - [ ] Setup monitoring
          - [ ] Configure backups
          
          ## 🌐 Nginx Configuration
          
          ```nginx
          server {
              listen 80;
              server_name your-domain.com;
              
              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
              
              location /static/ {
                  alias /path/to/staticfiles/;
                  expires 1y;
              }
          }
          ```
          
          ## 🔄 Celery Setup
          
          ```bash
          # Install Redis
          # Ubuntu: sudo apt install redis-server
          # macOS: brew install redis
          # Windows: Use WSL or download from GitHub
          
          # Start Worker
          celery -A config worker -l info --pool=solo
          
          # Start Beat
          celery -A config beat -l info
          ```
          
          ## 🐛 Troubleshooting
          
          **PyArmor runtime error (Windows)**:
          ```bash
          pyarmor gen runtime --platform windows.x86_64 --output win_runtime
          copy win_runtime\pyarmor_runtime_000000\pyarmor_runtime.pyd pyarmor_runtime_000000\
          ```
          
          **Static files not loading**:
          ```bash
          python manage.py collectstatic --noinput
          ```
          
          **Frontend not rendering**:
          Check `templates/index.html` exists and `static/assets/` has files.
          
          ## 📞 Support
          
          - Check `build-info.json` for build details
          - Review logs for errors
          - Enable DEBUG temporarily for details
          
          ---
          Build #${{ env.BUILD_VERSION }} | Protected by PyArmor & JavaScript Obfuscator
          EOFMD

      - name: Create Archive Files
        run: |


      - name: Create Archive Files
        run: |
          echo "📦 Creating deployment archives..."
          
          # Create tar.gz for Linux/macOS (flat structure)
          tar -czf django-react-complete-v${{ env.BUILD_VERSION }}.tar.gz -C deployment .
          echo "✅ Created .tar.gz archive"
          
          # Create zip for Windows (flat structure)
          cd deployment && zip -r ../django-react-complete-v${{ env.BUILD_VERSION }}.zip . && cd ..
          echo "✅ Created .zip archive"
          
          echo "✅ Archives created with flat structure!"

      - name: Upload Complete Package (TAR.GZ)
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-tar
          path: django-react-complete-v${{ env.BUILD_VERSION }}.tar.gz
          retention-days: 90

      - name: Upload Complete Package (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-zip
          path: django-react-complete-v${{ env.BUILD_VERSION }}.zip
          retention-days: 90

      - name: Generate Build Report
        run: |
          cat > build-report.md << 'EOFREP'
          # 📊 Build Report
          
          ## Build Details
          - **Build Number**: #${{ env.BUILD_VERSION }}
          - **Commit SHA**: `${{ github.sha }}`
          - **Branch**: ${{ github.ref_name }}
          - **Trigger**: ${{ github.event_name }}
          - **Actor**: @${{ github.actor }}
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Protection Mode**: ${{ github.event.inputs.protection_mode || 'standard' }}
          
          ## 📦 Artifacts Generated
          
          ### Main Artifact: `complete-backend-deployment`
          This is the **ONLY** artifact you need to deploy!
          
          ✅ **Complete Backend Build** 
          - Protected Python code (PyArmor)
          - All Django apps and models
          - Migrations (unprotected)
          
          ✅ **Integrated Frontend**
          - Obfuscated JavaScript/CSS
          - All assets in `static/assets/`
          - Collected files in `staticfiles/assets/`
          - React entry point in `templates/index.html`
          
          ✅ **Ready to Deploy**
          - No separate frontend needed
          - No manual file copying required
          - Just extract and run DEPLOY script
          
          ## 🔒 Protection Applied
          
          ### Backend (PyArmor)
          - Obfuscation Level: 2 (Strong)
          - Module Protection: Enabled
          - JIT Compilation: Enabled
          - Mode: ${{ github.event.inputs.protection_mode || 'standard' }}
          
          ### Frontend (JavaScript Obfuscator)
          - Control Flow Flattening: 75%
          - Dead Code Injection: 40%
          - String Array Encoding: Base64
          - Self Defending: Enabled
          
          ## 📥 How to Download
          
          1. Go to [Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          2. Scroll to **Artifacts** section
          3. Download ONE of these (they're identical):
             - `deployment-package-zip` (Windows - recommended)
             - `deployment-package-tar` (Linux/macOS - recommended)
             - `complete-backend-deployment` (raw files)
          
          ## 🚀 Deployment Instructions
          
          ### Quick Deploy
          ```bash
          # Windows
          1. Extract the ZIP file
          2. Run: DEPLOY.bat
          
          # Linux/macOS
          1. Extract: tar -xzf django-react-complete-v${{ env.BUILD_VERSION }}.tar.gz
          2. Run: bash DEPLOY.sh
          
          # Auto-start on Windows (optional)
          Run: setup_autostart.bat
          ```